<div class="table-container">
  <div class="table-actions-header">
    <div class="search-box">
      <i class="ri-search-line"></i>
      <input type="text" placeholder="Search..." (input)="onSearch($event)" />
    </div>
    <button class="btn-refresh" (click)="onRefresh()" title="Refresh Data">
      <i class="ri-refresh-line"></i>
    </button>
  </div>
  <table class="data-table">
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col.header }}</th>
        <th *ngIf="actions" class="actions-col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of filteredData">
        <td *ngFor="let col of columns">
          <ng-container *ngIf="col.type === 'status'">
            <span class="status-badge" [ngClass]="row[col.field]?.toLowerCase()">
              {{ row[col.field] }}
            </span>
          </ng-container>
          <span *ngIf="col.type === 'currency'">
            {{ row[col.field] | currency: col.currencyCode }}
          </span>
          <span *ngIf="!col.type || col.type === 'text'">
            {{ row[col.field] }}
          </span>
        </td>
        <td *ngIf="actions" class="actions-cell">
          <button class="btn-action edit" (click)="onEdit(row)">
            <i class="ri-pencil-line"></i>
          </button>
          <button class="btn-action delete" (click)="onDelete(row)">
            <i class="ri-delete-bin-line"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="filteredData.length === 0">
        <td [attr.colspan]="columns.length + (actions ? 1 : 0)" class="no-data">
          No data available.
        </td>
      </tr>
    </tbody>
  </table>
</div>
