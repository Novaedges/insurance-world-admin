<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Provider Name</label>
    <input type="text" formControlName="providerName" placeholder="e.g., Twilio" />
  </div>

  <div class="form-group">
    <label>Phone Number</label>
    <input type="text" formControlName="phoneNumber" placeholder="+1234567890" />
  </div>

  <div class="form-group">
    <label>Status</label>
    <select formControlName="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
      @if (isSubmitting) {
        <i class="ri-loader-4-line animate-spin"></i>
      }
      {{ isSubmitting ? 'Saving...' : 'Save Config' }}
    </button>
  </div>
</form>
