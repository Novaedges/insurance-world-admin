<div class="page-header">
  <h2>WhatsApp Templates</h2>
  <button class="btn-primary" (click)="openForm()">+ Create Template</button>
</div>

<app-table
  [data]="items"
  [columns]="columns"
  (edit)="openForm($event)"
  (delete)="onDelete($event)"
  (refresh)="loadData(true)"
>
</app-table>

<app-dialog
  [isOpen]="isModalOpen"
  [title]="selectedItem ? 'Edit Template' : 'Add Template'"
  (closeEvent)="closeForm()"
>
  <app-whatsapp-template-form 
    [data]="selectedItem" 
    [isSubmitting]="isSubmitting"
    (save)="onSave($event)" 
    (cancel)="closeForm()">
  </app-whatsapp-template-form>
</app-dialog>
