<div class="dialog-header">
  <h3>Update Inquiry</h3>
  <button class="btn-close" (click)="close()">
    <i class="ri-close-line"></i>
  </button>
</div>

<div class="dialog-content">
  <div class="form-group">
    <label>Status <span class="required">*</span></label>
    <select [(ngModel)]="formData.status" [disabled]="isSubmitting">
      @for (status of statusOptions; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
  </div>

  @if (formData.status === 'Completed') {
    <div class="form-group conditional-group slide-down">
      <label>Selling Price <span class="required">*</span></label>
      <div class="input-with-prefix">
        <span class="prefix">₹</span>
        <input
          type="number"
          [(ngModel)]="formData.sellingPrice"
          placeholder="Enter Final Price"
          [disabled]="isSubmitting"
        />
      </div>
      <span class="hint text-muted text-xs">Required when marking as Completed</span>
    </div>

    <div class="form-group conditional-group slide-down">
      <label>Policy ID <span class="text-muted text-xs">(Optional)</span></label>
      <input
        type="text"
        [(ngModel)]="formData.policyId"
        placeholder="Enter Sold Policy Object ID"
        [disabled]="isSubmitting"
      />
    </div>

    <div class="form-group conditional-group slide-down">
      <label>Policy Type ID <span class="text-muted text-xs">(Optional)</span></label>
      <input
        type="text"
        [(ngModel)]="formData.policyTypeId"
        placeholder="Enter Policy Type Object ID"
        [disabled]="isSubmitting"
      />
    </div>
  }
</div>

<div class="dialog-actions">
  <button class="btn-secondary" (click)="close()" [disabled]="isSubmitting">Cancel</button>
  <button class="btn-primary" (click)="onSubmit()" [disabled]="isSubmitting">
    @if (isSubmitting) {
      Saving...
    } @else {
      Save Changes
    }
  </button>
</div>
