<div class="dialog-header">
  <h3>Assign Sales Person</h3>
  <button class="btn-close" (click)="close()">
    <i class="ri-close-line"></i>
  </button>
</div>

<div class="dialog-content">
  <div class="form-group">
    <label>Sales Person <span class="required">*</span></label>
    <select [(ngModel)]="selectedSalesExecutiveId" [disabled]="isSubmitting">
      <option value="">Select Sales Person</option>
      @for (admin of admins; track admin._id) {
        <option [value]="admin._id">{{ admin.name }} ({{ admin.email }})</option>
      }
    </select>
  </div>
</div>

<div class="dialog-actions">
  <button class="btn-secondary" (click)="close()" [disabled]="isSubmitting">Cancel</button>
  <button
    class="btn-primary"
    (click)="onSubmit()"
    [disabled]="isSubmitting || !selectedSalesExecutiveId"
  >
    @if (isSubmitting) {
      Assigning...
    } @else {
      Assign
    }
  </button>
</div>
