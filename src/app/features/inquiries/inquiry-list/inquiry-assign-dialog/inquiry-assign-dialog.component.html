<div class="dialog-content">
  <div class="modern-form">
    <!-- Sales Person Field -->
    <div class="form-group">
      <label class="form-label">
        <i class="ri-user-follow-line"></i>
        Sales Person <span class="required">*</span>
      </label>
      <div class="select-wrapper">
        <select
          [(ngModel)]="selectedSalesExecutiveId"
          [disabled]="isSubmitting"
          class="form-select"
        >
          <option value="">Select Sales Person</option>
          @for (admin of admins; track admin._id) {
            <option [value]="admin._id">
              {{ admin.displayName }}
            </option>
          }
        </select>
        <i class="ri-arrow-down-s-line dropdown-icon"></i>
      </div>
    </div>
  </div>

  <div class="dialog-actions">
    <button class="btn-secondary" (click)="close()" [disabled]="isSubmitting">Cancel</button>
    <button
      class="btn-primary"
      (click)="onSubmit()"
      [disabled]="isSubmitting || !selectedSalesExecutiveId"
    >
      @if (isSubmitting) {
        <i class="ri-loader-4-line spin"></i> Updating...
      } @else {
        Update Enquiry
      }
    </button>
  </div>
</div>
