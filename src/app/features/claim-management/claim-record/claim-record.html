    <div class="custom-select-container" (click)="$event.stopPropagation()">
      <div
        class="select-box"
        [class.open]="isStatusDropdownOpen"
        (click)="toggleStatusDropdown($event)"
      >
        <span class="selected-text">{{ getSelectedStatusText() }}</span>
        <i class="ri-arrow-down-s-line"></i>
      </div>
      @if (isStatusDropdownOpen) {
        <div class="select-dropdown">
          @for (status of availableStatuses; track status) {
            <label class="dropdown-item" [class.active-item]="selectedStatuses.includes(status)">
              <input
                type="checkbox"
                [value]="status"
                [checked]="selectedStatuses.includes(status)"
                (change)="toggleStatus(status)"
              />
              <span class="item-text">{{ status }}</span>
            </label>
          }
        </div>
      }
    </div>
    <button class="btn-primary" (click)="onDownload()" [disabled]="isLoading">
      <i class="ri-file-excel-2-line"></i>
      <span>Download Excel</span>
    </button>
  </div>
</div>

<div class="table-container glass-panel">
  <app-table
    [data]="claims"
    [columns]="columns"
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [isLoading]="isLoading"
    (pageChange)="onPageChange($event)"
    (refresh)="onRefresh()"
    (edit)="onUpdateStatus($event)"
    [editTooltip]="'Complete Claim'"
    [editDisableField]="'status'"
    [actions]="true"
    [hiddenActions]="['delete', 'password', 'view']"
  >
  </app-table>
</div>
