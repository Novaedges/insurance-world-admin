<div class="page-header">
  <div class="header-content">
    <h2>Promotional Banners</h2>
    <p>Manage promotional banners displayed on the portal.</p>
  </div>
  <button class="btn-primary" (click)="openForm()">
    <i class="ri-add-line"></i>
    Add Banner
  </button>
</div>

<div class="glass-panel">
  <app-table
    [data]="items"
    [columns]="columns"
    [isLoading]="isLoading"
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [hiddenActions]="['view', 'password']"
    [showStatusFilter]="true"
    [statusFilterValue]="isActiveFilter ? 'true' : 'false'"
    deleteConfirmMessage="Are you want to sure one"
    (statusFilterChange)="onStatusFilterChange($event)"
    (pageChange)="onPageChange($event)"
    (edit)="openForm($event)"
    (delete)="onDelete($event)"
    (refresh)="loadData()"
  >
    <ng-template let-row="row" let-column="column">
      @if (column.field === 'showInPortal') {
        <span class="badge" [class.success]="row.showInPortal" [class.warning]="!row.showInPortal">
          {{ row.showInPortal ? 'Visible' : 'Hidden' }}
        </span>
      }
    </ng-template>
  </app-table>
</div>

<!-- Modal for Add/Edit Banner -->
<app-dialog
  [isOpen]="isModalOpen"
  [title]="selectedItem ? 'Edit Banner' : 'Add Banner'"
  (closeEvent)="closeForm()"
>
  <app-banner-form
    [bannerData]="selectedItem"
    [isSubmitting]="isSubmitting"
    (save)="onSave($event)"
    (cancel)="closeForm()"
  ></app-banner-form>
</app-dialog>
