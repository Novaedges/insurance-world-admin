<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Company Name</label>
    <input type="text" formControlName="companyName" placeholder="Enter company name" />
  </div>

  <div class="form-group">
    <label>Contact Number</label>
    <input type="text" formControlName="contactNumber" placeholder="Enter contact number" />
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" formControlName="email" placeholder="Enter email" />
  </div>

  <div class="form-group">
    <label>Helpline Number</label>
    <input type="text" formControlName="helplineNumber" placeholder="Enter helpline number" />
  </div>

  <div class="form-group full-width">
    <label>Website (Optional)</label>
    <input type="text" formControlName="website" placeholder="https://example.com" />
  </div>

  <div class="form-group full-width">
    <label>Address</label>
    <textarea formControlName="address" rows="3" placeholder="Enter physical address"></textarea>
  </div>

  <div class="form-group">
    <label>Company Logo</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    <div class="image-preview" *ngIf="imagePreview">
      <img [src]="imagePreview" alt="Company Logo" style="max-height: 100px; margin-top: 10px" />
    </div>
  </div>

  <div class="form-actions full-width">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
      <i
        class="ri-loader-4-line animate-spin"
        *ngIf="isSubmitting"
        style="margin-right: 0.5rem"
      ></i>
      {{
        isSubmitting
          ? company
            ? 'Updating...'
            : 'Adding...'
          : company
            ? 'Update Company'
            : 'Add Company'
      }}
    </button>
  </div>
</form>
