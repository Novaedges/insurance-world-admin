<div class="page-header">
  <h2>RTO Management</h2>
  <button class="btn-primary" (click)="openForm()">+ Add RTO</button>
</div>

<app-table
  [data]="items"
  [columns]="columns"
  [isLoading]="isLoading"
  [hiddenActions]="['password']"
  [showStatusFilter]="true"
  [statusFilterValue]="isActiveFilter ? 'true' : 'false'"
  deleteConfirmMessage="Are you want to sure one"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)"
  (statusFilterChange)="onStatusFilterChange($event)"
  (view)="onView($event)"
  (edit)="openForm($event)"
  (delete)="onDelete($event)"
  (refresh)="loadData()"
>
</app-table>

<app-dialog
  [isOpen]="isModalOpen"
  [title]="selectedItem ? 'Edit RTO' : 'Add RTO'"
  (closeEvent)="closeForm()"
>
  <app-rto-form [data]="selectedItem" (save)="onSave($event)" (cancel)="closeForm()">
  </app-rto-form>
</app-dialog>

<app-dialog [isOpen]="isInfoModalOpen" title="RTO Information" (closeEvent)="closeInfoModal()">
  <div class="modern-info-container" *ngIf="infoData">
    <div class="info-header-card">
      <div class="header-title-box">
        <h3>{{ infoData.rtoName }}</h3>
        <p>RTO Code: {{ infoData.rtoCode }}</p>
      </div>
      <div>
        <span class="badge-modern" [ngClass]="infoData.isActive ? 'active' : 'inactive'">
          {{ infoData.isActive ? 'Active' : 'Inactive' }}
        </span>
      </div>
    </div>

    <div class="info-grid-modern">
      <div class="info-card">
        <div class="card-title"><i class="ri-map-pin-line"></i> Location Details</div>
        <div class="card-item">
          <span class="card-label">RTO Name</span>
          <span class="card-value">{{ infoData.rtoName }}</span>
        </div>
        <div class="card-item">
          <span class="card-label">RTO Code</span>
          <span class="card-value">{{ infoData.rtoCode }}</span>
        </div>
      </div>

      <div class="info-card">
        <div class="card-title"><i class="ri-history-line"></i> Metadata</div>
        <div class="card-item">
          <span class="card-label">Created At</span>
          <span class="card-value">{{ infoData.createdAt | date: 'dd MMM yyyy' }}</span>
        </div>
      </div>
    </div>
  </div>
</app-dialog>
