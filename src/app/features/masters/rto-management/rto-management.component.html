<div class="page-header">
  <h2>RTO Management</h2>
  <button class="btn-primary" (click)="openForm()">+ Add RTO</button>
</div>

<app-table
  [data]="items"
  [columns]="columns"
  (edit)="openForm($event)"
  (delete)="onDelete($event)"
  (refresh)="loadData()"
>
</app-table>

<app-dialog
  [isOpen]="isModalOpen"
  [title]="selectedItem ? 'Edit RTO' : 'Add RTO'"
  (closeEvent)="closeForm()"
>
  <app-rto-form [data]="selectedItem" (save)="onSave($event)" (cancel)="closeForm()">
  </app-rto-form>
</app-dialog>
