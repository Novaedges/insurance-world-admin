<div class="page-header">
  <h2>Insurance Categories</h2>
  <button class="btn-primary" (click)="openForm()">+ Add Category</button>
</div>

<app-table
  [data]="items"
  [columns]="columns"
  [isLoading]="isLoading"
  [hiddenActions]="['password']"
  [showStatusFilter]="true"
  [statusFilterValue]="isActiveFilter ? 'true' : 'false'"
  deleteConfirmMessage="Are you want to sure one"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)"
  (statusFilterChange)="onStatusFilterChange($event)"
  (view)="onView($event)"
  (edit)="openForm($event)"
  (delete)="onDelete($event)"
  (refresh)="loadData()"
>
</app-table>

<app-dialog
  [isOpen]="isModalOpen"
  [title]="selectedItem ? 'Edit Category' : 'Add Category'"
  (closeEvent)="closeForm()"
>
  <app-insurance-category-form
    [data]="selectedItem"
    [isSubmitting]="isSubmitting"
    (save)="onSave($event)"
    (cancel)="closeForm()"
  >
  </app-insurance-category-form>
</app-dialog>

<app-dialog [isOpen]="isInfoModalOpen" title="Category Information" (closeEvent)="closeInfoModal()">
  <div class="modern-info-container" *ngIf="infoData">
    <div class="info-header-card">
      <div class="header-logo-container" *ngIf="infoData.logo">
        <img [src]="infoData.logo" alt="Category Logo" class="modal-logo" />
      </div>
      <div class="header-title-box">
        <h3>{{ infoData.name }}</h3>
        <p>Type: {{ infoData.type }}</p>
        <p>Priority: {{ infoData.priority }}</p>
      </div>
      <div>
        <span class="badge-modern" [ngClass]="infoData.isActive ? 'active' : 'inactive'">
          {{ infoData.isActive ? 'Active' : 'Inactive' }}
        </span>
      </div>
    </div>

    <div class="info-grid-modern">
      <div class="info-card" style="grid-column: 1 / -1">
        <div class="card-title"><i class="ri-file-text-line"></i> Description</div>
        <div class="card-item">
          <span class="card-value">{{ infoData.description || 'No description available.' }}</span>
        </div>
      </div>
    </div>
  </div>
</app-dialog>
