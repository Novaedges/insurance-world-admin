<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Name</label>
    <input type="text" formControlName="name" placeholder="Enter full name" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" formControlName="email" placeholder="Enter email address" />
  </div>

  <div class="form-group">
    <label>Role</label>
    <select formControlName="role">
      <option value="Super Admin">Super Admin</option>
      <option value="Sales Admin">Sales Admin</option>
      <option value="Read-Only Admin">Read-Only Admin</option>
    </select>
  </div>

  <div class="form-group">
    <label>Status</label>
    <select formControlName="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Save Admin</button>
  </div>
</form>
