<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Name</label>
    <input type="text" formControlName="name" placeholder="Enter full name" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" formControlName="email" placeholder="Enter email address" />
  </div>

  <div class="form-group">
    <label>Role</label>
    <select formControlName="role">
      <option value="Super Admin">Super Admin</option>
      <option value="Admin">Admin</option>
      <option value="Sales">Sales</option>
    </select>
  </div>

  <div class="form-group">
    <label>Status</label>
    <select formControlName="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>

  @if (form.get('role')?.value !== 'Super Admin') {
    <div class="form-group full-width">
      <label>Module Access Permissions</label>
      <div class="permissions-grid">
        @for (module of availableModules; track module.id) {
          <label class="checkbox-item">
            <input
              type="checkbox"
              [checked]="isPermissionSelected(module.id)"
              (change)="togglePermission(module.id)"
            />
            <span>{{ module.name }}</span>
          </label>
        }
      </div>
    </div>
  }

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Save Admin</button>
  </div>
</form>
