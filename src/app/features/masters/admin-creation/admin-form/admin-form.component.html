<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group-row">
    <div class="form-group">
      <label>First Name</label>
      <input type="text" formControlName="firstName" placeholder="Enter first name" />
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input type="text" formControlName="lastName" placeholder="Enter last name" />
    </div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" formControlName="email" placeholder="Enter email address" />
  </div>

  <div class="form-group">
    <label>Phone Number</label>
    <input type="tel" formControlName="phoneNumber" placeholder="Enter phone number" />
    @if (form.get('phoneNumber')?.invalid && form.get('phoneNumber')?.touched) {
      <small class="error-text">Valid 10-digit number required</small>
    }
  </div>

  @if (!admin) {
    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        formControlName="password"
        placeholder="Enter password (min 8 chars)"
      />
    </div>
  }

  <div class="form-group">
    <label>Role</label>
    <select formControlName="roleType">
      <option value="SUPER_ADMIN">Super Admin</option>
      <option value="ADMIN">Admin</option>
      <option value="SALES-EXECUTIVE">Sales Executive</option>
    </select>
  </div>

  @if (form.get('roleType')?.value !== 'SUPER_ADMIN') {
    <div class="form-group full-width">
      <label>Module Access Permissions</label>
      <div class="permissions-container">
        <div class="permissions-body">
          @for (module of availableModules; track module.id) {
            <div class="module-permission-row" [class.enabled]="isModuleEnabled(module.id)">
              <div class="module-info">
                <label class="switch">
                  <input
                    type="checkbox"
                    [checked]="isModuleEnabled(module.id)"
                    (change)="toggleModule(module.id)"
                  />
                  <span class="slider round"></span>
                </label>
                <span class="module-name-text">{{ module.name }}</span>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  }

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Save Admin</button>
  </div>
</form>
