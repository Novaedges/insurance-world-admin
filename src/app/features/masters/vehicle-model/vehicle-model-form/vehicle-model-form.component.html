<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Model Name</label>
    <input type="text" formControlName="name" placeholder="Enter Model Name" />
  </div>

  <div class="form-group">
    <label>Category</label>
    <select formControlName="vehicleTypeId">
      <option value="" disabled>Select Category</option>
      <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.name }}</option>
    </select>
  </div>

  <div class="form-group">
    <label>Make</label>
    <select formControlName="manufacturerId">
      <option value="" disabled>Select Make</option>
      <option *ngFor="let make of filteredMakes" [value]="make._id">{{ make.name }}</option>
    </select>
    <small
      *ngIf="filteredMakes.length === 0 && form.get('vehicleTypeId')?.value"
      class="text-muted"
    >
      No makes found for selected category
    </small>
  </div>

  <div class="form-group">
    <label>Model Logo</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    <div class="image-preview" *ngIf="imagePreview" style="margin-top: 10px">
      <img [src]="imagePreview" alt="Model Logo" style="max-height: 100px; border-radius: 4px" />
    </div>
  </div>

  <div class="form-group">
    <label>Engine CC (Optional)</label>
    <input type="text" formControlName="engineCC" placeholder="e.g. 1500" />
  </div>

  <div class="form-group">
    <label>Fuel Type</label>
    <select formControlName="fuelType">
      <option value="Petrol">Petrol</option>
      <option value="Diesel">Diesel</option>
      <option value="Electric">Electric</option>
      <option value="CNG">CNG</option>
    </select>
  </div>

  <div class="form-group">
    <label>Priority</label>
    <input type="number" formControlName="priority" placeholder="Enter Priority" />
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
      <i
        class="ri-loader-4-line animate-spin"
        *ngIf="isSubmitting"
        style="margin-right: 0.5rem"
      ></i>
      {{ isSubmitting ? 'Saving...' : 'Save' }}
    </button>
  </div>
</form>
