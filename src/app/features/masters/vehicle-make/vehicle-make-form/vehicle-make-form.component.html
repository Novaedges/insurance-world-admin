<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Make Name</label>
    <input type="text" formControlName="name" placeholder="Enter Make Name (e.g. Honda)" />
  </div>

  <div class="form-group">
    <label>Category <span class="text-danger">*</span></label>
    <div class="permissions-grid">
      @for (cat of categories; track cat._id) {
        <label class="checkbox-item">
          <input
            type="checkbox"
            [value]="cat._id || ''"
            (change)="onCheckboxChange($event, cat._id || '')"
            [checked]="isSelected(cat._id || '')"
          />
          {{ cat.name }}
        </label>
      }
    </div>
    @if (form.get('vehicleTypeId')?.invalid && form.get('vehicleTypeId')?.touched) {
      <div class="error-msg" style="color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem">
        At least one Category is required
      </div>
    }
  </div>

  <div class="form-group">
    <label>Make Logo</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    <div class="image-preview" *ngIf="imagePreview" style="margin-top: 10px">
      <img [src]="imagePreview" alt="Make Logo" style="max-height: 100px; border-radius: 4px" />
    </div>
  </div>

  <div class="form-group">
    <label>Priority</label>
    <input type="number" formControlName="priority" placeholder="Enter Priority (e.g. 0)" />
  </div>

  <div class="form-group">
    <label>Status</label>
    <select formControlName="isActive">
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
      <i
        class="ri-loader-4-line animate-spin"
        *ngIf="isSubmitting"
        style="margin-right: 0.5rem"
      ></i>
      {{ isSubmitting ? 'Saving...' : 'Save' }}
    </button>
  </div>
</form>
