<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Policy Type <span class="text-danger">*</span></label>
    <input type="text" formControlName="policyType" placeholder="e.g. Comprehensive Insurance" />
  </div>

  <div class="form-group">
    <label>Tag <span class="text-danger">*</span></label>
    <input type="text" formControlName="tag" placeholder="e.g. COMPREHENSIVE" />
  </div>

  <div class="form-group">
    <label>Description</label>
    <input type="text" formControlName="description" placeholder="Description (Optional)" />
  </div>

  <div class="form-group">
    <label>Policy Logo</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    <div class="image-preview" *ngIf="imagePreview" style="margin-top: 10px">
      <img [src]="imagePreview" alt="Policy Logo" style="max-height: 100px; border-radius: 4px" />
    </div>
  </div>

  <div class="form-group">
    <label>Coverage Areas (Comma Separated)</label>
    <input
      type="text"
      formControlName="coverageText"
      placeholder="e.g. Own damage, Theft protection"
    />
  </div>

  <div class="form-group">
    <label>Status</label>
    <select formControlName="isActive">
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || isSubmitting">
      <i
        class="ri-loader-4-line animate-spin"
        *ngIf="isSubmitting"
        style="margin-right: 0.5rem"
      ></i>
      {{ isSubmitting ? 'Saving...' : 'Save' }}
    </button>
  </div>
</form>
