<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
  <div class="form-group">
    <label>Child Category Name</label>
    <input type="text" formControlName="name" placeholder="Enter Child Category Name" />
  </div>

  <div class="form-group">
    <label>Parent Category</label>
    <select formControlName="parentCategoryId">
      <option value="" disabled>Select Parent Category</option>
      @for (cat of parentCategories; track cat.id) {
        <option [value]="cat.id">{{ cat.name }} ({{ cat.type }})</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Status</label>
    <select formControlName="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid">Save</button>
  </div>
</form>
