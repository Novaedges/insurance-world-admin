<div class="page-header">
  <h2>My Profile</h2>
</div>

<div class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-avatar">
        <i class="ri-user-smile-line"></i>
      </div>
      <div class="profile-titles">
        <h3>
          {{ authService.currentUser()?.name || 'Administrator' }}
        </h3>
        <span class="role-badge">{{ authService.currentUser()?.role || 'User' }}</span>
        @if (authService.currentUser()?.status) {
          <span class="status-badge active">Active</span>
        } @else {
          <span class="status-badge inactive">Inactive</span>
        }
      </div>
    </div>

    <div class="profile-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            class="form-control"
            [value]="authService.currentUser()?.name || ''"
            disabled
          />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            class="form-control"
            [value]="authService.currentUser()?.email || 'N/A'"
            disabled
          />
        </div>

        <div class="form-group">
          <label>Contact Number (Primary)</label>
          <input
            type="text"
            class="form-control"
            [value]="
              authService.currentUser()?.contactNumber ||
              authService.currentUser()?.phoneNumber ||
              'N/A'
            "
            disabled
          />
        </div>

        <div class="form-group">
          <label>Role</label>
          <input
            type="text"
            class="form-control"
            [value]="authService.currentUser()?.role || 'N/A'"
            disabled
          />
        </div>
      </div>
    </div>

    <div class="profile-footer">
      <button
        class="btn-update-animated"
        [class.animating]="isUpdating"
        (click)="triggerUpdateAnimation()"
      >
        <span>Update Profile</span>
        <i class="ri-rocket-2-line"></i>
      </button>
    </div>
  </div>
</div>
